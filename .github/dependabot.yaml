# Dependabot config for runops-gateway.
#
# GitHub Actions: SHA pin 必須 (org policy "Require actions to be pinned to a
# full-length commit SHA") なので、Dependabot は SHA pin を新リリースの SHA に
# 自動で更新する。
#
# Supply-chain cooldown (org standard): 新規公開から 7 日待って採用する
# (侵害リリースをエコシステム側の検知が先回りできる猶予)。
#
# Go modules: 本リポは多数の OTel / GCP SDK に依存しているので、関連 module を
# group にまとめて 1 PR で更新する。
version: 2

# One Dependabot pull request per week for the whole repo (owner ruling
# 2026-09-14): every ecosystem below joins the `weekly` group, whose schedule is
# this repo's slot on a weeknight JST (hub `just dependabot-slot <repo>`) — one CI
# run on the runner pool per repo per week instead of one per ecosystem, and no
# org-wide Monday burst. The per-ecosystem cooldown and labels are unchanged;
# commit-message and open-pull-requests-limit live on the group (Dependabot
# refuses them on the entries).
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:02"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5

updates:
  - package-ecosystem: github-actions
    patterns: ["*"]
    multi-ecosystem-group: "weekly"
    directory: /
    cooldown:
      default-days: 7
  - package-ecosystem: gomod
    patterns: ["*"]
    multi-ecosystem-group: "weekly"
    directory: /
    cooldown:
      default-days: 7
